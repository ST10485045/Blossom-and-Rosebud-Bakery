<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <title>Our Products | Fresh Cakes & Pastries | Blossom and Rosebud</title>
    <meta name="description" content="Explore our wide range of freshly baked cakes, cupcakes, cookies, and bread. Order online or enquire today at Blossom and Rosebud Bakery.">
    <meta name="keywords" content="bakery, cakes, cupcakes, pastries, bread, Johannesburg bakery, fresh baked goods">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header & Nav go here -->
    <main>
        <h1>Our Products</h1>
        
        <!-- Search Feature -->
        <div class="search-container">
            <label for="productSearch">Search for a product:</label>
            <input type="text" id="productSearch" placeholder="e.g. Cupcakes">
        </div>

        <!-- Dynamic Content Container -->
        <div id="product-grid" class="product-grid">
            <!-- Products will be loaded here by JavaScript -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged product view">
    </div>

    <script src="js/products.js"></script>
    <script src="js/lightbox.js"></script>
</body>
</html>
