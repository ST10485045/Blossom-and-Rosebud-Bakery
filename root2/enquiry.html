<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enquiry | Blossom and Rosebud Bakery</title>
    <meta name="description" content="Enquire about our bakery products, pricing, and availability. Let us make your next celebration sweet.">
    <meta name="keywords" content="bakery enquiry, order cake, bakery prices Johannesburg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header & Nav go here -->
    <main>
        <h1>Make an Enquiry</h1>
        <form id="enquiryForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName">
                <span class="error-msg" id="nameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
                <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <span class="error-msg" id="phoneError"></span>
            </div>

            <div class="form-group">
                <label for="enquiryType">Type of Enquiry:</label>
                <select id="enquiryType" name="enquiryType">
                    <option value="">Please select...</option>
                    <option value="order">Product Order</option>
                    <option value="volunteer">Volunteer/Sponsor</option>
                </select>
                <span class="error-msg" id="typeError"></span>
            </div>

            <button type="submit">Send Enquiry</button>
            <div id="formResponse" class="success-msg"></div>
        </form>
    </main>
    <script src="js/validation.js"></script>
</body>
</html>
